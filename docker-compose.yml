services:
  shiro:
    container_name: shiro
    build:
      context: ./
    volumes:
      - ./src/:/home/shiro
    ports:
      # noVNC web client → http://localhost:6080/vnc.html
      - "6080:6080"
      # Raw VNC (optional — connect with any VNC client to localhost:5900)
      - "5900:5900"
      # gdb remote target inside the container (for `make gdb`)
      - "1234:1234"
    # Keep the container alive so `docker exec` works for builds.
    command: ["sleep", "infinity"]
